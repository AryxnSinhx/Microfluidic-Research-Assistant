<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ablation Scoring — Microfluidics RAFT</title>
<style>
  :root{
    --bg:#14171A; --panel:#1B1F23; --panel-2:#20252A; --border:#2B3138;
    --text:#E9E7E2; --muted:#8E949B; --muted-2:#5C6268;
    --magenta:#C4477B; --amber:#D9A441; --green:#4EA87A;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", ui-serif, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{display:flex;min-height:100vh;}

  /* ---- Sidebar ---- */
  #sidebar{
    width:300px; min-width:300px; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
  }
  #sidebar-header{padding:16px 16px 12px; border-bottom:1px solid var(--border);}
  #sidebar-header .title{font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:8px;}
  #progress-track{height:6px; border-radius:3px; background:var(--panel-2); overflow:hidden; margin-bottom:6px;}
  #progress-fill{height:100%; background:linear-gradient(90deg, var(--amber), var(--magenta)); width:0%; transition:width .3s ease;}
  #progress-label{font-family:var(--mono); font-size:11px; color:var(--muted);}

  #filters{padding:10px 16px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
  #filters select, #filters label{font-size:12px; color:var(--muted);}
  #filters select{background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:5px 8px; font-family:var(--sans);}
  #filters .row{display:flex; align-items:center; gap:6px;}

  #io-row{padding:10px 16px; border-bottom:1px solid var(--border); display:flex; gap:8px;}
  .btn-small{
    flex:1; font-family:var(--mono); font-size:11px; letter-spacing:.03em; text-transform:uppercase;
    background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:7px 6px; cursor:pointer; text-align:center;
  }
  .btn-small:hover{border-color:var(--muted);}
  #import-input{display:none;}

  #list{flex:1; overflow-y:auto; padding:6px 0;}
  .list-item{
    display:flex; align-items:center; gap:8px; padding:8px 16px; cursor:pointer;
    border-left:2px solid transparent; font-size:12.5px;
  }
  .list-item:hover{background:var(--panel-2);}
  .list-item.active{background:var(--panel-2); border-left-color:var(--magenta);}
  .list-item .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; background:var(--muted-2);}
  .list-item .idcond{font-family:var(--mono); color:var(--text); flex-shrink:0;}
  .list-item .catlabel{color:var(--muted-2); font-size:10.5px; margin-left:auto; font-family:var(--mono);}
  .list-item.scored .idcond{color:var(--green);}
  .group-label{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted-2); padding:10px 16px 4px;
  }

  /* ---- Main ---- */
  #main{flex:1; padding:28px 40px; max-width:900px; margin:0 auto; overflow-y:auto;}
  #topbar{display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .badge{
    font-family:var(--mono); font-size:11px; padding:4px 9px; border-radius:5px; letter-spacing:.02em;
    border:1px solid var(--border); color:var(--muted);
  }
  .badge.condition-base{color:#8E949B;}
  .badge.condition-rag_only{color:#7CA8D9;}
  .badge.condition-lora_only{color:#D99E7C;}
  .badge.condition-combined{color:var(--magenta); border-color:rgba(196,71,123,.4);}
  .badge.id{font-weight:600; color:var(--text);}

  .swatch{width:12px; height:12px; border-radius:50%; display:inline-block; margin-right:6px; vertical-align:middle;}

  #metrics{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .metric-chip{
    font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:6px;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
  }
  .metric-chip b{color:var(--text); font-weight:600;}

  #hint{
    background:rgba(217,164,65,.08); border:1px solid rgba(217,164,65,.3); border-left:3px solid var(--amber);
    border-radius:6px; padding:12px 14px; margin-bottom:20px; font-size:13px; line-height:1.55; color:#E9DCC0;
  }
  #hint .hint-label{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--amber); margin-bottom:5px; display:block;}

  #question{font-size:16px; line-height:1.5; margin-bottom:20px; color:var(--text); font-weight:500;}
  #question .qlabel{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-2); display:block; margin-bottom:6px; font-weight:400;}

  #answer-box{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px 20px;
    font-family:var(--serif); font-size:15px; line-height:1.65; color:#DEDBD4; white-space:pre-wrap;
    max-height:340px; overflow-y:auto; margin-bottom:26px;
  }

  #scoring{border-top:1px solid var(--border); padding-top:22px;}
  .score-group{margin-bottom:20px;}
  .score-group .label{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; display:block;}
  .btn-row{display:flex; gap:8px;}
  .score-btn{
    font-family:var(--mono); font-size:13px; padding:8px 14px; border-radius:6px; cursor:pointer;
    background:var(--panel); border:1px solid var(--border); color:var(--muted); min-width:42px; text-align:center;
  }
  .score-btn:hover{border-color:var(--muted);}
  .score-btn.selected{background:var(--magenta); border-color:var(--magenta); color:#fff;}
  .score-btn.selected.hall-no{background:var(--green); border-color:var(--green);}
  .score-btn.selected.hall-partial{background:var(--amber); border-color:var(--amber); color:#241c0a;}

  #notes{
    width:100%; min-height:70px; background:var(--panel); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:var(--sans); font-size:13px; padding:10px 12px; resize:vertical;
  }
  #notes:focus{outline:none; border-color:var(--muted);}

  #nav{display:flex; justify-content:space-between; align-items:center; margin-top:28px; padding-top:18px; border-top:1px solid var(--border);}
  .nav-btn{
    font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--panel-2); color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:9px 16px; cursor:pointer;
  }
  .nav-btn:hover{border-color:var(--muted);}
  .nav-btn:disabled{opacity:.35; cursor:default;}
  .nav-btn.primary{background:var(--magenta); border-color:var(--magenta); color:#fff;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--panel-2); border-radius:4px;}
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <div class="title">Ablation Scoring Pass</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-label">0 / 0 scored</div>
  </div>
  <div id="filters">
    <div class="row">
      <select id="filter-condition">
        <option value="">All conditions</option>
        <option value="base">base</option>
        <option value="rag_only">rag_only</option>
        <option value="lora_only">lora_only</option>
        <option value="combined">combined</option>
      </select>
    </div>
    <div class="row">
      <select id="filter-category">
        <option value="">All categories</option>
        <option value="fluency">fluency</option>
        <option value="eponym">eponym</option>
        <option value="abstention">abstention</option>
        <option value="synthesis">synthesis</option>
      </select>
    </div>
    <div class="row">
      <label><input type="checkbox" id="filter-unscored"> Unscored only</label>
    </div>
  </div>
  <div id="io-row">
    <div class="btn-small" id="export-btn">Export CSV</div>
    <div class="btn-small" id="import-btn">Load CSV</div>
    <input type="file" id="import-input" accept=".csv">
  </div>
  <div id="list"></div>
</div>

<div id="main">
  <div id="topbar"></div>
  <div id="metrics"></div>
  <div id="hint" style="display:none;"></div>
  <div id="question"></div>
  <div id="answer-box"></div>

  <div id="scoring">
    <div class="score-group">
      <span class="label">Domain fluency (1-5)</span>
      <div class="btn-row" id="fluency-buttons"></div>
    </div>
    <div class="score-group">
      <span class="label">Factual grounding (1-5)</span>
      <div class="btn-row" id="grounding-buttons"></div>
    </div>
    <div class="score-group">
      <span class="label">Hallucination</span>
      <div class="btn-row" id="hallucination-buttons"></div>
    </div>
    <div class="score-group">
      <span class="label">Notes</span>
      <textarea id="notes" placeholder="Optional notes..."></textarea>
    </div>
  </div>

  <div id="nav">
    <div class="nav-btn" id="prev-btn">&larr; Prev</div>
    <div class="nav-btn primary" id="next-unscored-btn">Next unscored &rsaquo;</div>
    <div class="nav-btn" id="next-btn">Next &rarr;</div>
  </div>
</div>

le of the diazonium salt, leading to the formation of an azo d", "top_retrieval_score": "", "auto_abstention_detected": "False", "auto_grounding_token_overlap": "", "domain_fluency_1to5": "", "factual_grounding_1to5": "", "hallucination_yes_no_partial": "", "notes": "", "diagnostic_hint": "Expected: grounded answer (core fluency)."}, {"id": "F4", "category": "fluency", "condition": "rag_only", "question": "How is a diazonium salt used to detect bilirubin in a sample, chemically speaking?", "answer": "A diazonium salt is used to detect bilirubin in a sample through a chemical reaction known as diazocoupling. In this reaction, bilirubin reacts with the diazonium salt to form an azodye called monoazobilirubin. This reaction is used in clinical chemistry for the determination of bilirubin levels in body fluids. The kinetics of this reaction are important for diagnostic purposes, as they can help distinguish between different sources of bilirubin. However, the reaction is complicated due to the insolubility of bilirubin in water and the presence of side reactions. The azodye formed contains only one-half of the bilirubin molecule, and there is a side-reaction leading to a few percent of a coupling product between one molecule of bilirubin and one molecule of the diazonium salt.", "top_retrieval_score": "0.722", "auto_abstention_detected": "False", "auto_grounding_token_overlap": "0.682", "domain_fluency_1to5": "", "factual_grounding_1to5": "", "hallucination_yes_no_partial": "", "notes": "", "diagnostic_hint": "Expected: grounded answer (core fluency)."}, {"id": "F5", "category": "fluency", "condition": "base", "question": "What role does channel geometry (e.g. herringbone or serpentine patterns) play in passive micromixer design?", "answer": "Channel geometry plays a significant role in the design of passive micromixers, which are devices used to mix fluids without the need for external energy sources. The specific geometry of the channels can influence the mixing effic // state[id__condition] = {domain_fluency_1to5, factual_grounding_1to5, hallucination_yes_no_partial, notes}
const state = {};
DATA.forEach(r => {
  const key = r.id + "__" + r.condition;
  state[key] = {
    domain_fluency_1to5: r.domain_fluency_1to5 || "",
    factual_grounding_1to5: r.factual_grounding_1to5 || "",
    hallucination_yes_no_partial: r.hallucination_yes_no_partial || "",
    notes: r.notes || ""
  };
});

const CONDITION_ORDER = ["base", "rag_only", "lora_only", "combined"];
let filtered = DATA.slice();
let currentIndex = 0;

function key(r){ return r.id + "__" + r.condition; }

function isScored(r){
  const s = state[key(r)];
  return !!(s.domain_fluency_1to5 && s.factual_grounding_1to5 && s.hallucination_yes_no_partial);
}

function swatchColor(r){
  // colorimetric-assay-style indicator: green = grounded/high overlap,
  // amber = borderline/abstained-appropriately, magenta = flagged/abstained unexpectedly
  const abst = String(r.auto_abstention_detected) === "True";
  const overlap = parseFloat(r.auto_grounding_token_overlap);
  if (abst) return "var(--amber)";
  if (!isNaN(overlap)) {
    if (overlap > 0.5) return "var(--green)";
    if (overlap > 0.25) return "var(--amber)";
    return "var(--magenta)";
  }
  return "var(--muted-2)";
}

function applyFilters(){
  const cond = document.getElementById("filter-condition").value;
  const cat = document.getElementById("filter-category").value;
  const unscoredOnly = document.getElementById("filter-unscored").checked;
  filtered = DATA.filter(r => {
    if (cond && r.condition !== cond) return false;
    if (cat && r.category !== cat) return false;
    if (unscoredOnly && isScored(r)) return false;
    return true;
  });
  if (currentIndex >= filtered.length) currentIndex = Math.max(0, filtered.length - 1);
  renderList();
  renderMain();
}

function renderProgress(){
  const total = DATA.length;
  const scored = DATA.filter(isScored).length;
  document.getElementById("progress-fill").style.width = (scored/total*100) + "%";
  document.getElementById("progress-label").textContent = scored + " / " + total + " scored";
}

function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let lastCat = null;
  filtered.forEach((r, i) => {
    if (r.category !== lastCat){
      const gl = document.createElement("div");
      gl.className = "group-label";
      gl.textContent = r.category;
      list.appendChild(gl);
      lastCat = r.category;
    }
    const item = document.createElement("div");
    item.className = "list-item" + (i === currentIndex ? " active" : "") + (isScored(r) ? " scored" : "");
    item.innerHTML = `<span class="dot" style="background:${swatchColor(r)}"></span>
      <span class="idcond">${r.id} · ${r.condition}</span>
      <span class="catlabel">${isScored(r) ? "done" : ""}</span>`;
    item.onclick = () => { currentIndex = i; renderMain(); renderList(); };
    list.appendChild(item);
  });
  renderProgress();
}

function renderMain(){
  if (filtered.length === 0){
    document.getElementById("topbar").innerHTML = "<em style='color:var(--muted)'>No rows match the current filters.</em>";
    document.getElementById("metrics").innerHTML = "";
    document.getElementById("hint").style.display = "none";
    document.getElementById("question").innerHTML = "";
    document.getElementById("answer-box").textContent = "";
    return;
  }
  const r = filtered[currentIndex];
  const s = state[key(r)];

  document.getElementById("topbar").innerHTML = `
    <span class="badge id">${r.id}</span>
    <span class="badge">${r.category}</span>
    <span class="badge condition-${r.condition}">${r.condition}</span>
  `;

  let metrics = "";
  if (r.top_retrieval_score) metrics += `<span class="metric-chip">retrieval score <b>${r.top_retrieval_score}</b></span>`;
  metrics += `<span class="metric-chip">auto-abstention <b>${r.auto_abstention_detected}</b></span>`;
  if (r.auto_grounding_token_overlap) metrics += `<span class="metric-chip">grounding overlap <b>${r.auto_grounding_token_overlap}</b></span>`;
  document.getElementById("metrics").innerHTML = metrics;

  const hintEl = document.getElementById("hint");
  if (r.diagnostic_hint){
    hintEl.style.display = "block";
    hintEl.innerHTML = `<span class="hint-label">Diagnostic context</span>${r.diagnostic_hint}`;
  } else {
    hintEl.style.display = "none";
  }

  document.getElementById("question").innerHTML = `<span class="qlabel">Question</span>${r.question}`;
  document.getElementById("answer-box").textContent = r.answer;

  renderButtonGroup("fluency-buttons", ["1","2","3","4","5"], s.domain_fluency_1to5, (val) => {
    s.domain_fluency_1to5 = val; renderMain(); renderList();
  });
  renderButtonGroup("grounding-buttons", ["1","2","3","4","5"], s.factual_grounding_1to5, (val) => {
    s.factual_grounding_1to5 = val; renderMain(); renderList();
  });
  renderHallucinationButtons(s);

  const notesEl = document.getElementById("notes");
  notesEl.value = s.notes;
  notesEl.oninput = () => { s.notes = notesEl.value; };

  document.getElementById("prev-btn").disabled = (currentIndex === 0);
  document.getElementById("next-btn").disabled = (currentIndex === filtered.length - 1);
}

function renderButtonGroup(containerId, options, selected, onClick){
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "score-btn" + (String(selected) === opt ? " selected" : "");
    btn.textContent = opt;
    btn.onclick = () => onClick(opt);
    el.appendChild(btn);
  });
}

function renderHallucinationButtons(s){
  const el = document.getElementById("hallucination-buttons");
  el.innerHTML = "";
  [["No","hall-no"],["Partial","hall-partial"],["Yes","hall-yes"]].forEach(([label, cls]) => {
    const btn = document.createElement("div");
    const isSel = s.hallucination_yes_no_partial === label;
    btn.className = "score-btn" + (isSel ? " selected " + cls : "");
    btn.textContent = label;
    btn.onclick = () => { s.hallucination_yes_no_partial = label; renderMain(); renderList(); };
    el.appendChild(btn);
  });
}

function goNextUnscored(){
  for (let i = 0; i < filtered.length; i++){
    const idx = (currentIndex + 1 + i) % filtered.length;
    if (!isScored(filtered[idx])){ currentIndex = idx; renderMain(); renderList(); return; }
  }
}

document.getElementById("filter-condition").onchange = applyFilters;
document.getElementById("filter-category").onchange = applyFilters;
document.getElementById("filter-unscored").onchange = applyFilters;
document.getElementById("prev-btn").onclick = () => { if (currentIndex > 0){ currentIndex--; renderMain(); renderList(); } };
document.getElementById("next-btn").onclick = () => { if (currentIndex < filtered.length - 1){ currentIndex++; renderMain(); renderList(); } };
document.getElementById("next-unscored-btn").onclick = goNextUnscored;

// ---- CSV export/import ----
function csvEscape(val){
  val = (val === undefined || val === null) ? "" : String(val);
  if (/[",\n]/.test(val)) return '"' + val.replace(/"/g, '""') + '"';
  return val;
}

function exportCSV(){
  const cols = ["id","category","condition","question","answer","top_retrieval_score",
    "auto_abstention_detected","auto_grounding_token_overlap",
    "domain_fluency_1to5","factual_grounding_1to5","hallucination_yes_no_partial","notes"];
  const lines = [cols.join(",")];
  DATA.forEach(r => {
    const s = state[key(r)];
    const row = {
      ...r,
      domain_fluency_1to5: s.domain_fluency_1to5,
      factual_grounding_1to5: s.factual_grounding_1to5,
      hallucination_yes_no_partial: s.hallucination_yes_no_partial,
      notes: s.notes
    };
    lines.push(cols.map(c => csvEscape(row[c])).join(","));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "scoring_sheet.csv"; a.click();
  URL.revokeObjectURL(url);
}

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i], next = text[i+1];
    if (inQuotes){
      if (c === '"' && next === '"'){ field += '"'; i++; }
      else if (c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"'){ inQuotes = true; }
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}

function importCSV(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    const rows = parseCSV(e.target.result);
    const header = rows[0];
    const idIdx = header.indexOf("id");
    const condIdx = header.indexOf("condition");
    const flIdx = header.indexOf("domain_fluency_1to5");
    const grIdx = header.indexOf("factual_grounding_1to5");
    const haIdx = header.indexOf("hallucination_yes_no_partial");
    const noIdx = header.indexOf("notes");
    let merged = 0;
    for (let i = 1; i < rows.length; i++){
      const row = rows[i];
      if (row.length < header.length) continue;
      const k = row[idIdx] + "__" + row[condIdx];
      if (state[k]){
        state[k].domain_fluency_1to5 = row[flIdx] || "";
        state[k].factual_grounding_1to5 = row[grIdx] || "";
        state[k].hallucination_yes_no_partial = row[haIdx] || "";
        state[k].notes = row[noIdx] || "";
        merged++;
      }
    }
    alert("Loaded " + merged + " scored rows from CSV.");
    renderList(); renderMain();
  };
  reader.readAsText(file);
}

document.getElementById("export-btn").onclick = exportCSV;
document.getElementById("import-btn").onclick = () => document.getElementById("import-input").click();
document.getElementById("import-input").onchange = (e) => {
  if (e.target.files[0]) importCSV(e.target.files[0]);
};

applyFilters();
</script>
